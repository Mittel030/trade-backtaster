<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trade Backtester</title>
  <!-- Tailwind CSS via CDN (prima voor leren/prototypen) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <main class="max-w-xl mx-auto p-4 space-y-6">

    <header>
      <h1 class="text-2xl font-bold">Trade Backtester</h1>
      <p class="text-slate-400 text-sm">Log je trades en test je day-trading strategie.</p>
    </header>

    <!-- Statistieken -->
    <section class="grid grid-cols-3 gap-3 text-center">
      <div class="bg-slate-900 rounded-xl p-3">
        <p class="text-xs text-slate-400">Totaal P&amp;L</p>
        <p id="stat-pnl" class="text-lg font-bold">€0.00</p>
      </div>
      <div class="bg-slate-900 rounded-xl p-3">
        <p class="text-xs text-slate-400">Win rate</p>
        <p id="stat-winrate" class="text-lg font-bold">0%</p>
      </div>
      <div class="bg-slate-900 rounded-xl p-3">
        <p class="text-xs text-slate-400">Trades</p>
        <p id="stat-count" class="text-lg font-bold">0</p>
      </div>
    </section>

    <!-- Functie 1: trade loggen -->
    <section class="bg-slate-900 rounded-xl p-4">
      <h2 class="font-semibold mb-3">Nieuwe trade</h2>
      <form id="trade-form" class="grid grid-cols-2 gap-3">
        <input name="symbol" placeholder="Symbool (bv. AAPL)" required
               class="col-span-2 bg-slate-800 rounded-lg p-3 uppercase">
        <select name="side" class="bg-slate-800 rounded-lg p-3">
          <option value="long">Long</option>
          <option value="short">Short</option>
        </select>
        <input name="strategy" placeholder="Strategie" required
               class="bg-slate-800 rounded-lg p-3">
        <input name="entry" type="number" step="any" placeholder="Entry prijs" required
               class="bg-slate-800 rounded-lg p-3">
        <input name="exit" type="number" step="any" placeholder="Exit prijs" required
               class="bg-slate-800 rounded-lg p-3">
        <input name="quantity" type="number" step="any" placeholder="Aantal" required
               class="bg-slate-800 rounded-lg p-3">
        <input name="fees" type="number" step="any" placeholder="Kosten (optioneel)"
               class="bg-slate-800 rounded-lg p-3">
        <button type="submit"
                class="col-span-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg p-3 font-semibold">
          Trade opslaan
        </button>
      </form>
    </section>

    <!-- Functie 3: filterbare geschiedenis -->
    <section class="bg-slate-900 rounded-xl p-4">
      <h2 class="font-semibold mb-3">Trade-geschiedenis</h2>
      <div class="grid grid-cols-2 gap-3 mb-4">
        <input id="filter-symbol" placeholder="Filter symbool"
               class="bg-slate-800 rounded-lg p-3 uppercase">
        <select id="filter-result" class="bg-slate-800 rounded-lg p-3">
          <option value="all">Alles</option>
          <option value="win">Winst</option>
          <option value="loss">Verlies</option>
        </select>
      </div>
      <ul id="trade-list" class="space-y-2"></ul>
      <p id="empty-msg" class="text-slate-500 text-sm text-center py-4">Nog geen trades.</p>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
