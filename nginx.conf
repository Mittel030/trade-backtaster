server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker-DNS; met een variabele wordt Yahoo pas opgezocht bij een verzoek,
    # zodat nginx ook start als er (even) geen internet is
    resolver 127.0.0.11 valid=300s;
    set $yahoo query1.finance.yahoo.com;

    # Yahoo Finance staat geen verzoeken direct vanuit de browser toe (CORS).
    # Daarom haalt nginx de koersdata op: /api/yahoo/MNQ=F?... -> Yahoo chart-API
    location ~ ^/api/yahoo/([A-Za-z0-9.=^-]+)$ {
        proxy_pass https://$yahoo/v8/finance/chart/$1$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host $yahoo;
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
    }
}
